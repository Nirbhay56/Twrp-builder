name: Recovery Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache bison build-essential curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc zip zlib1g-dev

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize and Sync TWRP Source
        run: |
          mkdir workspace
          cd workspace
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp -b twrp-12.1
          repo sync -c --no-clone-bundle --no-tags -j$(nproc)

      - name: Clone Device Tree
        run: |
          cd workspace
          git clone https://github.com/twrpdtgen/android_device_xiaomi_umi device/xiaomi/umi

      - name: Build TWRP Recovery
        run: |
          cd workspace
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch twrp_umi-userdebug || lunch omni_umi-userdebug
          make recoveryimage -j$(nproc)


      - name: Upload Recovery Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi_Mi10_TWRP
          path: workspace/out/target/product/umi/recovery.img
          
