name: Patch Prebuilt Recovery Image

on:
  workflow_dispatch:
    inputs:
      recovery_url:
        description: 'Direct Download Link to Pablo Gaunis OrangeFox / Recovery Image'
        required: true
        default: 'https://github.com/path/to/pablo_recovery.img'

jobs:
  patch_recovery:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Android Image Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y abootimg cpio gzip wget android-sdk-libsparse-utils

      - name: Download Prebuilt Recovery Image
        run: |
          mkdir workspace
          cd workspace
          wget -O pablo_recovery.img "${{ github.event.inputs.recovery_url }}"

      - name: Unpack, Patch Android 17 Keymaster & Repack
        run: |
          cd workspace
          mkdir unpacked && cd unpacked
          abootimg -x ../pablo_recovery.img
          mkdir ramdisk && cd ramdisk
          gzip -d -c ../initrd.img | cpio -i
          
          # Patch crashing keymaster & crypto HAL flags causing the Android 17 splash freeze
          if [ -f prop.default ]; then
            sed -i 's/ro.crypto.state=encrypted/ro.crypto.state=unencrypted/g' prop.default
            sed -i 's/ro.crypto.volume.metadata.method=1/ro.crypto.volume.metadata.method=0/g' prop.default
            echo "ro.crypto.state=unencrypted" >> prop.default
          fi
          
          if [ -f default.prop ]; then
            sed -i 's/ro.crypto.state=encrypted/ro.crypto.state=unencrypted/g' default.prop
            echo "ro.crypto.state=unencrypted" >> default.prop
          fi

          # Repack patched ramdisk
          find . | cpio -o -H newc | gzip > ../new_initrd.img
          cd ..
          abootimg -u ../pablo_recovery.img -r new_initrd.img

      - name: Upload Patched Recovery Image
        uses: actions/upload-artifact@v4
        with:
          name: Patched_Pablo_OrangeFox_A17
          path: workspace/pablo_recovery.img
          
